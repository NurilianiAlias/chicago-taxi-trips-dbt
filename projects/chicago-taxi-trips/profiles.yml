chicago_taxi_trips:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: silver                # default dataset for dev runs
      keyfile_json: "{{ env_var('GCP_SA_KEY') }}"
      threads: 4
      timeout_seconds: 300

    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: gold                  # production dataset for marts
      keyfile_json: "{{ env_var('GCP_SA_KEY') }}"
      threads: 8
      timeout_seconds: 600
